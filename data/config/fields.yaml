# The app's 16 interest fields (build/fields.py FIELDS), defined as groups of MOET's major codes.
#
# MOET's code is the taxonomy (Thông tư 09/2022/TT-BGDĐT; data/manual/moet_majors.csv): digits 1-3 = lĩnh vực,
# 1-5 = nhóm ngành, 1-7 = ngành. A program's field comes from its major code: the longest prefix listed below wins.
# Rules for this file:
#   - follow MOET's grouping: map whole lĩnh vực, split one only along its nhóm ngành;
#   - a single ngành moves only where a field's own description names it (data science, logistics, chemistry);
#   - every lĩnh vực is mapped except 790 Khác; programs without a code fall back to name keywords.
# `uniadvisor build` checks that every prefix exists in MOET's catalog.

cntt:          # Công nghệ thông tin - Máy tính - Dữ liệu - AI
  - "748"      # Máy tính và công nghệ thông tin
  - "7460108"  # Khoa học dữ liệu (MOET files it under Toán học)
ky_thuat:      # Kỹ thuật - Công nghệ (cơ khí, điện, điện tử, ô tô, tự động hóa, vật liệu)
  - "751"      # Công nghệ kỹ thuật (incl. 75106 Quản lý công nghiệp, Kinh tế công nghiệp)
  - "752"      # Kỹ thuật
  - "75402"    # Sản xuất, chế biến sợi, vải, giày, da
  - "75490"    # Sản xuất và chế biến: khác
kinh_te:       # Kinh tế - Kinh doanh - Quản trị - Marketing - Thương mại
