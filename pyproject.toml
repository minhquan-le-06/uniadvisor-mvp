[project]
name = "uniadvisor"
version = "0.1.0"
description = "University application advisor (nguyện vọng) for Vietnamese grade-12 students: rules + statistics + a small typed-head language model"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "httpx>=0.27",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "streamlit>=1.40",
]

[project.optional-dependencies]
slm = ["torch>=2.3", "transformers>=4.44", "safetensors>=0.4"]
dev = ["pytest>=8"]

[project.scripts]
uniadvisor = "uniadvisor.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"  # no .pytest_cache folder in the repo root
