# Words a student uses for an area of study -> MOET codes. Module 2 reads a student's interests, dislikes and their
# family's wishes with these (backend/uniadvisor/student/intent/keywords.py).
#
# Codes follow one rule (the same as the synthetic truth in slm/synth.py PHRASE_CODES): a nhóm ngành (5 digits); a
# ngành (7) where its nhóm ngành also holds things the student did not mean (data science sits in Toán học, chemistry
# next to physics, logistics in Quản lý công nghiệp); a lĩnh vực (3) for a word that broad. A code covers the programs
# under it that data/config/fields.yaml does not move to another field (intent.covers).
#
# MOET's own ngành, nhóm ngành and lĩnh vực names are added automatically (data/manual/moet_majors.csv); a ngành
# name gives its nhóm ngành. A term listed here wins over a MOET name.
#
# Matching is on whole words without diacritics, longest term first, so "sư phạm toán" is read once, as teacher
# training, not also as mathematics.

# terms that count only right after one of these words ("học Toán", "ngành IT", "làm AI", "sợ Hóa"), because alone
# they are school subjects or everyday words ("Toán là môn mạnh nhất", "kinh tế nhà em", "dù ai cũng bảo")
cue_words: [học, ngành, theo, về, làm, muốn, thích, mê, ghét, sợ]
cue_only: [it, ai, toán, lý, lí, hóa, y, dược, điện, kinh tế, kỹ thuật, công nghệ, kỹ sư, sức khỏe, đầu tư, dịch vụ]

# terms containing these words are read only from text with diacritics: without them they are other words
# ("dược học" / "được học", "máu" / "màu", "vẽ" / "về")
needs_diacritics: [dược, máu, vẽ]

# MOET names that are everyday phrases in a student's text ("kinh tế gia đình em không khá")
skip_moet_names: [kinh tế gia đình]

terms:
  # Máy tính và công nghệ thông tin: students do not tell MOET's Máy tính and Công nghệ thông tin apart
