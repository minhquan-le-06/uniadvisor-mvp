# MVP scope: THPT exam-score method only, universities in 2 regions (Hà Nội, TP.HCM).
# `candidates` is what the collectors fetch. The build step keeps a school only if it has enough
# usable THPT cutoffs (see `min_*`), and writes the final list to data/processed/schools.csv.
#
# Excluded on purpose: military/police schools (extra health/gender/region rules), and art / sport
# / music schools (need an aptitude test, i.e. another admission method).

admission_year: 2027          # the season we advise for
history_years: [2023, 2024, 2025, 2026]   # years the news collectors fetch; ADS_Final adds 2018-2024
regions: ["Hà Nội", "TP. Hồ Chí Minh"]

min_programs_2026: 5          # usable THPT cutoffs (30-point scale) in the latest year
max_schools: 50

candidates:
  "Hà Nội": [BKA, QHI, QHT, QHX, QHE, QHF, QHS, KHA, NTH, TMU, NHH, HTC, BVH, DCN, GHA, XDA,
             LPH, SPH, YHB, NHF, TLA, HQT, KMA, DTL, MHN, HBT, HCP, MDA, DDL, HVN, PKA, FBU]
  "TP. Hồ Chí Minh": [QSB, QSC, QST, QSX, QSK, QSQ, KSA, NHS, SPK, SPS, IUH, DTT, DMS, LPS, NLS,
                      MBS, SGD, YDS, DKC, DVL, UEF, HSU, BVS, KTS, NTS, DCT, HIU, SIU]
